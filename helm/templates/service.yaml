apiVersion: v1
kind: Service

metadata:
  name: {{ include "nodejs-app.fullname" . }}

spec:
  type: {{ .Values.service.type }}

  selector:
    app: {{ include "nodejs-app.name" . }}

  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP